name: Headless physics

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "Pillow>=10,<13"
      - run: python -m unittest discover -s tests -v
      - run: python -m pendulum_wave.cli --count 3 --duration 0.02 --dt 0.01 --output /tmp/states.csv
      - run: python -m pendulum_wave.render --count 3 --duration 0.1 --fps 10 --output /tmp/wave.gif
      - run: python -m pendulum_wave.convergence
      - run: python -m pendulum_wave.evidence
      - run: ./scripts/verify_showcase.sh
